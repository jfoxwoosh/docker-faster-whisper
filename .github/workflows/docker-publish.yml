name: Build and Publish Docker Image

# Trigger this script every time code is pushed to the 'main' branch
on:
  push:
    branches:
      - main

# Give GitHub permission to save the package into your repository
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Download your repository's code onto the GitHub runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Docker's build tool (Buildx)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to GitHub Container Registry (ghcr.io)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Gather package tags and labels (like 'latest' or commit hashes)
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest

      # Step 5: Build the Docker image and upload it to GitHub Packages
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ id.meta.outputs.tags }}
          labels: ${{ id.meta.outputs.labels }}
